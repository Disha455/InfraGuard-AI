<h2 class="sr-only">Full entity relationship diagram for the road infrastructure database: Users, Roads, Road Inspections, Inspection Images, AI Damage Detection, Risk Predictions, Maintenance Records, Weather History, and Citizen Reports, with all fields and types</h2>
<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USERS ||--o{ ROAD_INSPECTIONS : conducts
  USERS ||--o{ CITIZEN_REPORTS : submits
  ROADS ||--o{ ROAD_INSPECTIONS : has
  ROADS ||--o{ MAINTENANCE_RECORDS : has
  ROADS ||--o{ WEATHER_HISTORY : has
  ROADS ||--o{ RISK_PREDICTIONS : has
  ROADS ||--o{ CITIZEN_REPORTS : referenced_by
  ROAD_INSPECTIONS ||--o{ INSPECTION_IMAGES : has
  INSPECTION_IMAGES ||--|| AI_DAMAGE_DETECTION : has

  USERS {
    uuid user_id PK
    varchar full_name
    varchar email
    text password_hash
    enum role
    varchar phone
    timestamp created_at
  }
  ROADS {
    uuid road_id PK
    varchar road_name
    varchar zone
    double latitude
    double longitude
    float length_m
    float width_m
    varchar surface_material
    integer construction_year
    integer road_age_years
    integer average_daily_traffic
    integer drainage_score
  }
  ROAD_INSPECTIONS {
    uuid inspection_id PK
    uuid road_id FK
    uuid officer_id FK
    date inspection_date
    text remarks
    varchar weather_condition
    varchar overall_condition
  }
  INSPECTION_IMAGES {
    uuid image_id PK
    uuid inspection_id FK
    text image_url
    timestamp uploaded_at
  }
  AI_DAMAGE_DETECTION {
    uuid detection_id PK
    uuid image_id FK
    integer pothole_count
    integer crack_count
    float crack_length
    float damaged_area_percent
    varchar severity
    float confidence
    varchar model_version
  }
  RISK_PREDICTIONS {
    uuid prediction_id PK
    uuid road_id FK
    date prediction_date
    float risk_score
    varchar risk_level
    float probability
    text recommended_action
    varchar model_version
  }
  MAINTENANCE_RECORDS {
    uuid maintenance_id PK
    uuid road_id FK
    date maintenance_date
    varchar maintenance_type
    varchar contractor
    decimal estimated_cost
    decimal actual_cost
    varchar completion_status
  }
  WEATHER_HISTORY {
    uuid weather_id PK
    uuid road_id FK
    timestamp recorded_at
    float rainfall_mm
    float temperature
    float humidity
    varchar weather_condition
  }
  CITIZEN_REPORTS {
    uuid report_id PK
    uuid citizen_id FK
    uuid road_id FK
    double latitude
    double longitude
    text description
    text image_url
    varchar report_status
  }`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
